# Secret scan (gitleaks)
#
# Fails any PR or push whose NEW commits contain a secret (API keys, tokens,
# private keys, .env values, ...). Only the commit range being added is
# scanned, so findings already in old history don't block work.
# Output is --redact'ed: secret values never appear in CI logs.
#
# False positive? Add its fingerprint (printed in the failing job, format
# <commit>:<file>:<rule>:<line>) as a line in .gitleaksignore at the repo root.
# Never "fix" a finding by committing a real key there or elsewhere: if it is a
# real secret, rotate it first, then remove it from the branch.
#
# Uses the gitleaks CLI directly (the official gitleaks-action needs a paid
# license for org repos). The tarball is pinned by SHA-256.

name: Secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # New branch or force-push with unknown base: scan the tip commit only.
            range="-1 ${PUSH_AFTER}"
          else
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "Scanning: $range"
          gitleaks git --redact --verbose --log-opts="$range" --exit-code 1 .
