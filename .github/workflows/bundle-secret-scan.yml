name: Bundle Secret Scan

# Scans application source (pre-build) and the compiled Next.js build output
# (post-build) for accidentally-committed or accidentally-bundled secrets,
# and audits every NEXT_PUBLIC_* name referenced in source against an
# allow-list. See scripts/check-bundle-secrets.mjs.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  bundle-secret-scan:
    name: Bundle Secret Scan
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan source for secrets (pre-build)
        run: node scripts/check-bundle-secrets.mjs --source-only

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-bundle-scan-${{ hashFiles('**/pnpm-lock.yaml', 'src/**/*.ts', 'src/**/*.tsx') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-bundle-scan-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-bundle-scan-

      - name: Build application
        run: pnpm build
        env:
          # Same placeholder env vars the existing `build` job in ci.yml
          # uses — this workflow only needs the build to complete, not to
          # talk to real services.
          NODE_OPTIONS: '--max-old-space-size=8192'
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID || 'test-privy-app-id' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.gatewayz.ai' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}

      - name: Scan build output for secrets
        run: node scripts/check-bundle-secrets.mjs
